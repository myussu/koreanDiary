org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 en modo compatible: conserva el constructor sin argumentos de toda clase que una regla conserva.
# Las librerías viejas que trae ML Kit (WorkManager 2.7, Room 2.2, componentes de Firebase) crean sus
# clases por reflexión con reglas que lo dan por hecho; en modo completo la app se cerraba al abrir y
# «Revisar» no leía la letra (las dos reglas que lo arreglan están en app/proguard-rules.pro; esto
# cubre los casos que no hayamos visto). AGP 10 quita esta opción: antes de subir, probar el APK
# release en un emulador (abrir la app, «Revisar» una página).
android.enableR8.fullMode=false
kotlin.code.style=official
