name: Kiwi prueba (Android)

# Compila la app de prueba de Kiwi (kiwiPrueba/) y la publica en el release "kiwi-prueba"
# (enlace fijo, aparte del release "latest" de la app). Se instala al lado de la app sin tocarla.
on:
  push:
    paths:
      - "kiwiPrueba/**"
      - ".github/workflows/kiwi-prueba.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiwi-prueba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # La librería y el modelo de Kiwi (release oficial de bab2min/Kiwi) y las formas del diccionario.
      - name: Bajar Kiwi
        run: kiwiPrueba/preparar.sh

      - name: Compilar
        run: ./gradlew --stacktrace :kiwiPrueba:assembleRelease

      - name: Preparar APK
        run: |
          cp kiwiPrueba/build/outputs/apk/release/kiwiPrueba-release.apk kiwi-prueba.apk
          ls -la kiwi-prueba.apk

      - uses: actions/upload-artifact@v7
        with:
          name: kiwi-prueba-${{ github.run_number }}
          path: kiwi-prueba.apk

      - name: Publicar release "kiwi-prueba"
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete kiwi-prueba --yes --cleanup-tag || true
          gh release create kiwi-prueba kiwi-prueba.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Kiwi prueba (${GITHUB_SHA::7})" \
            --notes "App de prueba de Kiwi para Android: mide carga, memoria, velocidad y aciertos en el celular. Se instala al lado de la app («Kiwi prueba»), no la toca. Rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}: ${COMMIT_MSG}"
