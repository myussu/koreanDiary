name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK y correr tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk koreandiary.apk

      - uses: actions/upload-artifact@v7
        with:
          name: koreandiary-apk-${{ github.run_number }}
          path: koreandiary.apk

      # Publica el APK en un release "latest" fijo: el enlace de descarga siempre es el mismo.
      - name: Publicar release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest koreandiary.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Última compilación (#${{ github.run_number }})" \
            --notes "Commit ${GITHUB_SHA::7}: ${COMMIT_MSG}"
