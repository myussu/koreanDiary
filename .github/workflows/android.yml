name: APK

on:
  push:
    branches: [main]
    # La prueba de escritorio no cambia el APK: no publica un "latest" nuevo para el celular.
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/prueba-reconocedor.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK y correr tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      # El esquema que generó esta compilación, por si hay que agregarlo al repo.
      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.run_number }}
          path: app/schemas
          if-no-files-found: warn

      # Si la compilación deja el esquema de la base distinto al del repo, no se publica.
      # - Un JSON que ya existía cambió: se tocó una entidad sin subir la versión. La app instalada
      #   no abriría su base. Siempre falla.
      # - Hay un JSON nuevo (versión nueva): en un pull request se agrega solo a la rama, porque aquí
      #   no se compila en local; en main falla, para que los cambios de esquema pasen por un PR.
      - name: Verificar el esquema de la base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ -z "$(git status --porcelain -- app/schemas)" ] && exit 0
          git status --short -- app/schemas
          if ! git diff --quiet -- app/schemas; then
            git --no-pager diff -- app/schemas | head -100
            echo "::error::Cambió el esquema de una versión ya publicada de la base. Sube la versión en AppDatabase.kt y agrega una AutoMigration en vez de modificar la versión actual."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            git ls-files --others --exclude-standard -- app/schemas | while read -r f; do
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" --silent \
                -f branch="$HEAD_REF" \
                -f message="Base de datos: esquema $(basename "$f") generado por la compilación" \
                -f content="$(base64 -w0 "$f")"
              echo "::notice::Se agregó $f a la rama $HEAD_REF."
            done
          else
            echo "::error::La compilación generó un esquema nuevo que no está en el repo. Haz el cambio de entidad en un pull request (Actions agrega el JSON a la rama) o agrega app/schemas al commit desde el artefacto room-schemas."
            exit 1
          fi

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk koreandiary.apk

      - uses: actions/upload-artifact@v7
        with:
          name: koreandiary-apk-${{ github.run_number }}
          path: koreandiary.apk

      # Publica el APK en un release "latest" fijo: el enlace de descarga siempre es el mismo.
      - name: Publicar release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # version.json: lo lee el actualizador de la app para saber si hay algo nuevo.
          jq -n \
            --argjson code "$GITHUB_RUN_NUMBER" \
            --arg name "0.1.$GITHUB_RUN_NUMBER" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg notes "$COMMIT_MSG" \
            --arg sha "$(sha256sum koreandiary.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s koreandiary.apk)" \
            '{versionCode: $code, versionName: $name, commit: $commit, notes: $notes, sha256: $sha, size: $size}' \
            > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest koreandiary.apk version.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "0.1.${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}: ${COMMIT_MSG}"
