name: APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK y correr tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      # El esquema que generó esta compilación, por si hay que agregarlo al repo.
      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas-${{ github.run_number }}
          path: app/schemas
          if-no-files-found: warn

      # Si la compilación cambió el esquema de la base y ese cambio no está en el repo, no se publica:
      # o se cambió una entidad sin subir la versión (la app instalada no abriría su base),
      # o falta agregar el JSON de la versión nueva.
      - name: Verificar el esquema de la base
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            git --no-pager diff -- app/schemas | head -100
            echo "::error::El esquema de Room cambió y no está en el repo. Si cambiaste una entidad, sube la versión en AppDatabase.kt y agrega una AutoMigration; luego agrega app/schemas al commit (está en el artefacto room-schemas de esta compilación)."
            exit 1
          fi

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk koreandiary.apk

      - uses: actions/upload-artifact@v7
        with:
          name: koreandiary-apk-${{ github.run_number }}
          path: koreandiary.apk

      # Publica el APK en un release "latest" fijo: el enlace de descarga siempre es el mismo.
      - name: Publicar release "latest"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # version.json: lo lee el actualizador de la app para saber si hay algo nuevo.
          jq -n \
            --argjson code "$GITHUB_RUN_NUMBER" \
            --arg name "0.1.$GITHUB_RUN_NUMBER" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg notes "$COMMIT_MSG" \
            --arg sha "$(sha256sum koreandiary.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c%s koreandiary.apk)" \
            '{versionCode: $code, versionName: $name, commit: $commit, notes: $notes, sha256: $sha, size: $size}' \
            > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest koreandiary.apk version.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "0.1.${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}: ${COMMIT_MSG}"
